</style></head><body><div class="panel"><div class="cab"><span>Arquitectura de la plataforma Red Rooster</span><span class="der">React → FastAPI → casos de uso → puertos → adaptadores · ETL → modelos → analytics_*</span></div><svg width="1098" height="820" viewBox="0 0 1098 820" role="img" aria-label="Diagrama de la arquitectura de la plataforma"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="pta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/></marker></defs><text x="20" y="26" font-size="16" font-weight="700" fill="#4a5563">Arquitectura hexagonal (backend/app)</text><rect x="20" y="36" width="560" height="98" rx="8" fill="#e8f1fb" stroke="#4f86c6" stroke-width="1.6"/><text x="32" y="61" font-size="16" font-weight="700" fill="#1f2933">1 · Frontend React + Vite (puerto 5180)</text><text x="32" y="84" font-size="14" fill="#2f3a48">Inicio · Analítica · Clientes · Asesor · Datos · POS · Productos</text><text x="32" y="104" font-size="14" fill="#2f3a48">Cliente HTTP con JWT (services/api.ts)</text><rect x="20" y="152" width="560" height="98" rx="8" fill="#e9f6ec" stroke="#4f9a63" stroke-width="1.6"/><text x="32" y="177" font-size="16" font-weight="700" fill="#1f2933">2 · API FastAPI (puerto 8010), adaptadores de entrada</text><text x="32" y="200" font-size="14" fill="#2f3a48">/api/v1: auth · products · customers · sales · inventory</text><text x="32" y="220" font-size="14" fill="#2f3a48">kpis · analytics · advisor · etl   (JWT y esquemas Pydantic)</text><polyline points="300,134 300,150" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="20" y="268" width="560" height="98" rx="8" fill="#f3ecfa" stroke="#8a63b8" stroke-width="1.6"/><text x="32" y="293" font-size="16" font-weight="700" fill="#1f2933">3 · Casos de uso (application/ y etl/pipeline.py)</text><text x="32" y="316" font-size="14" fill="#2f3a48">ServicioAnalitica · ServicioKpis · ServicioAsesor (guardrails)</text><text x="32" y="336" font-size="14" fill="#2f3a48">PipelineETL: extraer, transformar, entrenar y cargar</text><polyline points="300,250 300,266" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="20" y="384" width="560" height="98" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/><text x="32" y="409" font-size="16" font-weight="700" fill="#1f2933">4 · Puertos (domain/ports.py, Protocol)</text><text x="32" y="432" font-size="14" fill="#2f3a48">AnalyticsRepo · SaleRepo · CustomerRepo · EtlRunRepo</text><text x="32" y="452" font-size="14" fill="#2f3a48">AdvisorPort · CipherPort    (domain no importa adapters)</text><polyline points="300,366 300,382" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><polyline points="300,482 300,524" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="20" y="526" width="122" height="118" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/><text x="32" y="551" font-size="16" font-weight="700" fill="#1f2933">Fernet</text><text x="32" y="574" font-size="13" fill="#2f3a48">crypto/</text><text x="32" y="594" font-size="13" fill="#2f3a48">cifra correo y</text><text x="32" y="614" font-size="13" fill="#2f3a48">teléfono</text><rect x="166" y="526" width="122" height="118" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/><text x="178" y="551" font-size="16" font-weight="700" fill="#1f2933">Gemini</text><text x="178" y="574" font-size="13" fill="#2f3a48">llm/</text><text x="178" y="594" font-size="13" fill="#2f3a48">con IA o modo</text><text x="178" y="614" font-size="13" fill="#2f3a48">simulado</text><rect x="312" y="526" width="122" height="118" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/><text x="324" y="551" font-size="16" font-weight="700" fill="#1f2933">ML</text><text x="324" y="574" font-size="13" fill="#2f3a48">ml/ (DataFrames)</text><text x="324" y="594" font-size="13" fill="#2f3a48">XGBoost · Apriori</text><text x="324" y="614" font-size="13" fill="#2f3a48">K-Means RFM</text><rect x="458" y="526" width="122" height="118" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/><text x="470" y="551" font-size="16" font-weight="700" fill="#1f2933">SQLite</text><text x="470" y="574" font-size="13" fill="#2f3a48">persistence/</text><text x="470" y="594" font-size="13" fill="#2f3a48">SQLAlchemy</text><text x="470" y="614" font-size="13" fill="#2f3a48">red_rooster.db</text><text x="20" y="518" font-size="13" font-weight="600" fill="#4a5563">5 · Adaptadores de salida y modelos</text><text x="20" y="672" font-size="14" fill="#2f3a48">Sentido de las dependencias: frontend → API → casos de uso → puertos ← adaptadores.</text><text x="20" y="694" font-size="14" fill="#2f3a48">etl/ y ml/ trabajan sobre DataFrames y puertos, sin SQLAlchemy.</text><text x="700" y="26" font-size="16" font-weight="700" fill="#4a5563">Flujo de datos</text><rect x="700" y="36" width="380" height="78" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/><text x="712" y="61" font-size="16" font-weight="700" fill="#1f2933">BD/pedidos.json · productos.json</text><text x="712" y="84" font-size="14" fill="#2f3a48">Fuente real (no se versiona)</text><polyline points="890,114 890,132" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="700" y="132" width="380" height="118" rx="8" fill="#e9f6ec" stroke="#4f9a63" stroke-width="1.6"/><text x="712" y="157" font-size="16" font-weight="700" fill="#1f2933">ETL de carga (etl/red_rooster.py)</text><text x="712" y="180" font-size="14" fill="#2f3a48">importar(): upsert de sales, sale_items,</text><text x="712" y="200" font-size="14" fill="#2f3a48">customers y products; reconstruir():</text><text x="712" y="220" font-size="14" fill="#2f3a48">dim_fecha, ventas_diarias, calidad_datos</text><polyline points="890,250 890,268" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="700" y="268" width="380" height="118" rx="8" fill="#f3ecfa" stroke="#8a63b8" stroke-width="1.6"/><text x="712" y="293" font-size="16" font-weight="700" fill="#1f2933">Pipeline de modelos (etl/pipeline.py)</text><text x="712" y="316" font-size="14" fill="#2f3a48">Extrae por watermark, imputa costos y entrena:</text><text x="712" y="336" font-size="14" fill="#2f3a48">XGBoost (demanda) · Apriori · K-Means</text><text x="712" y="356" font-size="14" fill="#2f3a48">Registra la corrida en etl_runs</text><polyline points="890,386 890,524" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="700" y="526" width="380" height="138" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/><text x="712" y="551" font-size="16" font-weight="700" fill="#1f2933">Tablas analytics_* y etl_runs (SQLite)</text><text x="712" y="574" font-size="14" fill="#2f3a48">analytics_demand_forecast</text><text x="712" y="594" font-size="14" fill="#2f3a48">analytics_market_basket_rules</text><text x="712" y="614" font-size="14" fill="#2f3a48">analytics_customer_segments</text><text x="712" y="634" font-size="14" fill="#2f3a48">etl_runs (MAE, R², n_reglas, k, silueta)</text><polyline points="580,585 698,585" fill="none" stroke="#4a5563" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#pta)"/><text x="640" y="577" font-size="13" font-weight="600" fill="#4a5563" text-anchor="middle">lee y escribe</text><polyline points="890,664 890,680" fill="none" stroke="#4a5563" stroke-width="2" marker-end="url(#pta)"/><rect x="700" y="682" width="380" height="118" rx="8" fill="#e8f1fb" stroke="#4f86c6" stroke-width="1.6"/><text x="712" y="707" font-size="16" font-weight="700" fill="#1f2933">Consumo</text><text x="712" y="730" font-size="14" fill="#2f3a48">Tableros Inicio y Analítica (/kpis, /analytics)</text><text x="712" y="750" font-size="14" fill="#2f3a48">Asesor: contexto analítico → Gemini →</text><text x="712" y="770" font-size="14" fill="#2f3a48">guardrails (máx. 30 % de descuento)</text></svg></div></body></html>
